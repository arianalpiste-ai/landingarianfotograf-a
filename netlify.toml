# netlify.toml
# Configuracion explicita del sitio (equivalente a lo ya configurado a mano
# en el dashboard de Netlify: Base directory = Sitio_Web, Functions directory =
# Sitio_Web/netlify/functions). Tenerlo en el repo evita depender de memoria
# o de que alguien cambie la configuracion por accidente en el dashboard.

[build]
base = "Sitio_Web"
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
for = "/.netlify/functions/*"
[headers.values]
Cache-Control = "no-store"
