# Netlify only: the current arianalpiste.com site is deployed separately on Cloudflare Pages.
# This repository has no build step; the static site lives in Sitio_Web/.
[build]
  base = "."
  publish = "Sitio_Web"

# Exact routes precede the catch-all. force overrides existing static HTML and 404 files.
[[redirects]]
  from = "/"
  to = "https://arianalpiste.com/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://arianalpiste.com/"
  status = 301
  force = true

